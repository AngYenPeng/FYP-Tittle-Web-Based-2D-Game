<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password - Abyss Miner</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #050816, #0f172a, #1e1b4b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .background {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.45;
      animation: float 12s ease-in-out infinite;
    }

    .orb1 { width: 280px; height: 280px; background: #3b82f6; top: 10%; left: 10%; }
    .orb2 { width: 320px; height: 320px; background: #8b5cf6; bottom: 10%; right: 10%; animation-delay: 2s; }

    @keyframes float {
      0%,100% { transform: translate(0,0); }
      50% { transform: translate(-15px,-20px); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 400px;
      padding: 30px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    h2 { text-align: center; margin-bottom: 10px; }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      color: white;
    }

    input::placeholder { color: #94a3b8; }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .toggle {
      font-size: 13px;
      text-align: right;
      margin-top: 5px;
      color: #cbd5e1;
    }

    #message {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }

    hr {
      border: 0;
      border-top: 1px solid rgba(255,255,255,0.15);
      margin: 18px 0;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 12px;
      color: #c4b5fd;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <div class="background">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
  </div>

  <div class="card">
    <h2>Reset Password</h2>
    <div class="subtitle">Enter your email to receive a reset code</div>

    <input type="email" id="email" placeholder="Enter your email">
    <button onclick="requestCode()">Send Reset Code</button>

    <hr>

    <input type="text" id="resetCode" placeholder="Enter reset code">
    <input type="password" id="newPassword" placeholder="New password">
    <input type="password" id="confirmPassword" placeholder="Confirm password">

    <div class="toggle">
      <label><input type="checkbox" onclick="toggle()"> Show Password</label>
    </div>

    <button onclick="resetPassword()">Reset Password</button>

    <p id="message"></p>

    <a href="/login.html">Back to Login</a>
  </div>

<script>
function toggle() {
  const p1 = document.getElementById("newPassword");
  const p2 = document.getElementById("confirmPassword");
  p1.type = p1.type === "password" ? "text" : "password";
  p2.type = p2.type === "password" ? "text" : "password";
}

function isValidPassword(password) {
  return /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$/.test(password);
}

async function requestCode() {
  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("message");

  if (!email) {
    message.innerText = "Enter your email.";
    return;
  }

  const res = await fetch("/api/auth/forgot-password", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email })
  });

  const data = await res.json();
  message.innerText = data.message || data.error;
}

async function resetPassword() {
  const email = document.getElementById("email").value.trim();
  const code = document.getElementById("resetCode").value.trim();
  const newPass = document.getElementById("newPassword").value.trim();
  const confirm = document.getElementById("confirmPassword").value.trim();
  const message = document.getElementById("message");

  if (!email || !code || !newPass || !confirm) {
    message.innerText = "Fill all fields.";
    return;
  }

  if (newPass !== confirm) {
    message.innerText = "Passwords do not match.";
    return;
  }

  if (!isValidPassword(newPass)) {
    message.innerText = "Password must contain letters + numbers (6+ chars).";
    return;
  }

  const res = await fetch("/api/auth/reset-password", {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email,
      resetCode: code,
      newPassword: newPass
    })
  });

  const data = await res.json();
  message.innerText = data.message || data.error;
}
</script>
</body>
</html>
