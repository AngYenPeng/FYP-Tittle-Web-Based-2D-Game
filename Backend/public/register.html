<!DOCTYPE html>
<html>
<head>
  <title>Register - Abyss Miner</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #050816, #0f172a, #1e1b4b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .background {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.45;
      animation: float 12s ease-in-out infinite;
    }

    .orb1 {
      width: 280px;
      height: 280px;
      background: #3b82f6;
      top: 8%;
      left: 8%;
    }

    .orb2 {
      width: 320px;
      height: 320px;
      background: #8b5cf6;
      bottom: 10%;
      right: 10%;
      animation-delay: 2s;
    }

    .orb3 {
      width: 180px;
      height: 180px;
      background: #38bdf8;
      top: 55%;
      left: 55%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) translateX(0px) scale(1);
      }
      50% {
        transform: translateY(-20px) translateX(15px) scale(1.08);
      }
    }

    .register-card {
  position: relative;
  z-index: 1;
  width: 430px;
  padding: 26px 26px;
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  backdrop-filter: blur(16px);
}

    .top-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      font-size: 30px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
    }

    h2 {
      text-align: center;
      margin: 0 0 8px 0;
      font-size: 28px;
      letter-spacing: 0.5px;
    }

    .subtitle {

  text-align: center;

  color: #cbd5e1;

  font-size: 14px;

  margin-bottom: 18px;

}

.field {

  margin-bottom: 12px;

}

    .label {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: block;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px 14px 14px 42px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 14px;
      outline: none;
      transition: 0.2s ease;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96,165,250,0.18);
    }

    .hint {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 6px;
    }

    .strength {
      margin-top: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .strength.weak {
      color: #ef4444;
    }

    .strength.medium {
      color: #f59e0b;
    }

    .strength.strong {
      color: #22c55e;
    }

    .toggle-row {
      text-align: right;
      margin-top: 6px;
      font-size: 13px;
      color: #cbd5e1;
    }

    .toggle-row label {
      cursor: pointer;
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
      margin-top: 10px;
    }

    .register-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.28);
    }

    .message {
      margin-top: 16px;
      min-height: 20px;
      text-align: center;
      font-size: 14px;
    }

    .links {
      margin-top: 12px;
      text-align: center;
      line-height: 1.6;
      font-size: 14px;
    }

    .links a {
      color: #c4b5fd;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .footer-text {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }

    @media (max-width: 480px) {
      .register-card {
        width: 94%;
        padding: 22px 18px;
      }
    }

    #otpButton:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.28);
}

#otpButton:active {
  transform: scale(0.97);
}

  </style>
</head>
<body>
  <div class="background">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <div class="register-card">
    <div class="top-icon">🪨</div>

    <h2>Create Account</h2>
    <div class="subtitle">Join Abyss Miner and start your journey</div>

    <div class="field">
      <label class="label">Username</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="username" placeholder="Enter username">
      </div>
    </div>

    <div class="field">
      <label class="label">Email</label>
      <div class="input-wrap">
        <span class="input-icon">✉️</span>
        <input type="email" id="email" placeholder="Enter email">
      </div>
    </div>

    <div class="field">
  <label class="label">Email OTP</label>

  <div style="display:flex; gap:10px;">
    <div class="input-wrap" style="flex:1;">
      <span class="input-icon">🔢</span>
      <input type="text" id="otp" placeholder="Enter OTP">
    </div>

    <button
  type="button"
  id="otpButton"
  onclick="sendOTP()"
  style="
    border:none;
    border-radius:12px;
    padding:0 16px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    cursor:pointer;
    min-width:110px;
    transition:0.2s ease;
    font-weight:bold;
    transform:translateY(0);
  ">
  Send OTP
</button>
  </div>
</div>

    <div class="field">
      <label class="label">Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Enter password" oninput="checkPasswordStrength()">
      </div>
      <div class="hint">Use at least 6 characters, with letters and numbers.</div>
      <div id="strengthText" class="strength"></div>
    </div>

    <div class="field">
      <label class="label">Confirm Password</label>
      <div class="input-wrap">
        <span class="input-icon">✅</span>
        <input type="password" id="confirmPassword" placeholder="Confirm password">
      </div>
    </div>

    <div class="toggle-row">
      <label><input type="checkbox" onclick="togglePasswords()"> Show Passwords</label>
    </div>

    <button class="register-btn" onclick="register()">Create Account</button>

    <div class="message" id="message"></div>

    <div class="links">
      <div>Already have an account? <a href="/login.html">Login</a></div>
    </div>

    <div class="footer-text">Abyss Miner Web Portal</div>
  </div>

  <script>
    function isValidPassword(password) {
  const regex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$/;
  return regex.test(password);
}

    function togglePasswords() {
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirmPassword");

      password.type = password.type === "password" ? "text" : "password";
      confirmPassword.type = confirmPassword.type === "password" ? "text" : "password";
    }

    function checkPasswordStrength() {
      const password = document.getElementById("password").value;
      const strengthText = document.getElementById("strengthText");

      if (!password) {
        strengthText.innerText = "";
        strengthText.className = "strength";
        return;
      }

      const hasLetter = /[A-Za-z]/.test(password);
      const hasNumber = /\d/.test(password);
      const hasMinLength = password.length >= 6;

      if (password.length < 6 || (!hasLetter && !hasNumber)) {
        strengthText.innerText = "Weak password";
        strengthText.className = "strength weak";
      } else if (hasMinLength && (hasLetter || hasNumber) && !(hasLetter && hasNumber)) {
        strengthText.innerText = "Medium password";
        strengthText.className = "strength medium";
      } else if (hasMinLength && hasLetter && hasNumber) {
        strengthText.innerText = "Strong password";
        strengthText.className = "strength strong";
      }
    }

   async function sendOTP() {
  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("message");
  const otpButton = document.getElementById("otpButton");

  if (!email) {
    message.style.color = "#f87171";
    message.innerText = "Please enter email first.";
    return;
  }

  try {

    otpButton.disabled = true;
    otpButton.innerText = "Sending...";
    otpButton.style.opacity = "0.7";
    otpButton.style.cursor = "not-allowed";

    const res = await fetch("/api/auth/send-otp", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email })
    });

    const data = await res.json();

    if (data.success) {

      message.style.color = "#4ade80";
      message.innerText = "OTP sent successfully.";

      let countdown = 60;

      otpButton.innerText = `Resend (${countdown}s)`;

      const timer = setInterval(() => {
        countdown--;

        otpButton.innerText = `Resend (${countdown}s)`;

        if (countdown <= 0) {
          clearInterval(timer);

          otpButton.disabled = false;
          otpButton.innerText = "Send OTP";
          otpButton.style.opacity = "1";
          otpButton.style.cursor = "pointer";
        }

      }, 1000);

    } else {

      otpButton.disabled = false;
      otpButton.innerText = "Send OTP";
      otpButton.style.opacity = "1";
      otpButton.style.cursor = "pointer";

      message.style.color = "#f87171";
      message.innerText = data.message || "Failed to send OTP.";
    }

  } catch (err) {

    console.log(err);

    otpButton.disabled = false;
    otpButton.innerText = "Send OTP";
    otpButton.style.opacity = "1";
    otpButton.style.cursor = "pointer";

    message.style.color = "#f87171";
    message.innerText = "Server error.";
  }
}
    async function register() {
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      const message = document.getElementById("message");
      const otp = document.getElementById("otp").value.trim();

      message.style.color = "#f87171";

      if (!username || !email || !password || !confirmPassword || !otp) {
  message.innerText = "Please fill in all fields.";
  return;
}

      if (password !== confirmPassword) {
        message.innerText = "Passwords do not match.";
        return;
      }

      if (!isValidPassword(password)) {
        message.innerText = "Password must be at least 6 characters and include letters and numbers.";
        return;
      }

      const res = await fetch("/api/auth/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, email, password, otp })
      });

      const data = await res.json();

      if (data.message && data.message.toLowerCase().includes("success")) {
        message.style.color = "#4ade80";
        message.innerText = data.message;

        setTimeout(() => {
          window.location.href = "/login.html";
        }, 1000);
        return;
      }

      message.innerText = data.message || data.error || "Something went wrong.";
    }
  </script>
</body>
</html>
