<!DOCTYPE html>
<html>
<head>
  <title>Login - Abyss Miner</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #050816, #0f172a, #1e1b4b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .background {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      transition: transform 0.12s linear;
      scale: 1.08;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.45;
      animation: float 12s ease-in-out infinite;
    }

    .orb1 {
      width: 280px;
      height: 280px;
      background: #3b82f6;
      top: 8%;
      left: 8%;
    }

    .orb2 {
      width: 320px;
      height: 320px;
      background: #8b5cf6;
      bottom: 10%;
      right: 10%;
      animation-delay: 2s;
    }

    .orb3 {
      width: 180px;
      height: 180px;
      background: #38bdf8;
      top: 55%;
      left: 55%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) translateX(0px) scale(1);
      }
      50% {
        transform: translateY(-20px) translateX(15px) scale(1.08);
      }
    }

    .cave-dust {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(147, 197, 253, 0.45);
      animation: drift 8s linear infinite;
    }

    .dust1 { top: 18%; left: 18%; animation-delay: 0s; }
    .dust2 { top: 70%; left: 25%; animation-delay: 2s; }
    .dust3 { top: 35%; left: 78%; animation-delay: 4s; }
    .dust4 { top: 82%; left: 70%; animation-delay: 1s; }

    @keyframes drift {
      0% {
        transform: translateY(0);
        opacity: 0.2;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-60px);
        opacity: 0.1;
      }
    }

    .ore {
      position: fixed;
      z-index: 1;
      width: 14px;
      height: 22px;
      background: linear-gradient(135deg, #67e8f9, #3b82f6);
      clip-path: polygon(50% 0%, 100% 35%, 78% 100%, 22% 100%, 0% 35%);
      box-shadow: 0 0 18px rgba(56,189,248,0.8);
      animation: oreGlow 2s ease-in-out infinite alternate;
      cursor: pointer;
    }

    .ore1 { left: 12%; bottom: 16%; }
    .ore2 { right: 14%; top: 24%; animation-delay: 0.6s; }
    .ore3 { left: 72%; bottom: 20%; animation-delay: 1.1s; }

    .ore.clicked {
      animation: oreClick 0.35s ease;
    }

    @keyframes oreGlow {
      from {
        transform: scale(1);
        opacity: 0.65;
      }
      to {
        transform: scale(1.18);
        opacity: 1;
      }
    }

    @keyframes oreClick {
      0% { transform: scale(1); }
      50% { transform: scale(1.9) rotate(15deg); }
      100% { transform: scale(1); }
    }

    .ore-counter {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 4;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #bae6fd;
      font-size: 13px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.25);
    }

    .miner {
      position: fixed;
      left: 35px;
      bottom: 35px;
      z-index: 2;
      font-size: 34px;
      pointer-events: none;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
      animation: minerIdle 1.2s ease-in-out infinite alternate;
    }

    /* Miner scared state */
.miner.scared {
  animation: minerScared 0.2s infinite alternate;
}

@keyframes minerScared {
  from { transform: translateY(0) translateX(0); }
  to { transform: translateY(-3px) translateX(3px); }
}

    @keyframes minerIdle {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-6px);
      }
    }

    .miner.walking {
  animation: minerWalk 0.4s infinite alternate;
}

@keyframes minerWalk {
  from { transform: translateY(0); }
  to { transform: translateY(-5px); }
}

    .mouse-creature {
      position: fixed;
      left: 40px;
      top: 40px;
      z-index: 2;
      width: 52px;
      height: 52px;
      pointer-events: none;
      transition: transform 0.08s linear;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.45));
    }

    .spider-body {
      position: absolute;
      left: 13px;
      top: 13px;
      width: 26px;
      height: 26px;
      background: #111827;
      border: 2px solid #a78bfa;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(167,139,250,0.8);
    }

    .spider-eye {
      position: absolute;
      top: 7px;
      width: 4px;
      height: 4px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(239,68,68,0.9);
    }

    .eye-left { left: 7px; }
    .eye-right { right: 7px; }

    .leg {
      position: absolute;
      width: 22px;
      height: 3px;
      background: #c4b5fd;
      border-radius: 999px;
      transform-origin: center;
    }

    .leg1 { left: -3px; top: 14px; transform: rotate(25deg); }
    .leg2 { left: -5px; top: 24px; transform: rotate(-10deg); }
    .leg3 { right: -3px; top: 14px; transform: rotate(-25deg); }
    .leg4 { right: -5px; top: 24px; transform: rotate(10deg); }

    .mouse-creature.walking .leg1,
    .mouse-creature.walking .leg4 {
      animation: legMoveA 0.28s infinite alternate;
    }

    .mouse-creature.walking .leg2,
    .mouse-creature.walking .leg3 {
      animation: legMoveB 0.28s infinite alternate;
    }

    @keyframes legMoveA {
      from { transform: rotate(30deg) translateX(0); }
      to { transform: rotate(-25deg) translateX(3px); }
    }

    @keyframes legMoveB {
      from { transform: rotate(-25deg) translateX(0); }
      to { transform: rotate(30deg) translateX(3px); }
    }

    .mouse-creature.attack .spider-body {
      animation: spiderBite 0.28s ease;
    }

    @keyframes spiderBite {
      0% { transform: scale(1); }
      50% { transform: scale(1.55) rotate(8deg); }
      100% { transform: scale(1); }
    }

    .creature-label {
      position: fixed;
      left: 70px;
      top: 70px;
      z-index: 2;
      pointer-events: none;
      color: #cbd5e1;
      font-size: 12px;
      opacity: 0.7;
    }

    /* Spider watching (when user focuses password) */
.mouse-creature.watching .spider-eye {
  background: #22c55e;
  box-shadow: 0 0 8px rgba(34,197,94,0.9);
}

/* Spider angry (when typing password) */
.mouse-creature.angry .spider-eye {
  background: #ef4444;
  box-shadow: 0 0 10px rgba(239,68,68,1);
}

/* Slight body shake when angry */
.mouse-creature.angry {
  animation: angryShake 0.2s infinite alternate;
}

@keyframes angryShake {
  from { transform: translateY(0); }
  to { transform: translateY(-3px); }
}

.mouse-creature.hide-eyes .spider-eye {
  opacity: 0;
}

.spider-trail {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(167,139,250,0.35);
  box-shadow: 0 0 10px rgba(167,139,250,0.5);
  pointer-events: none;
  z-index: 2;
  animation: trailFade 0.5s ease forwards;
}

@keyframes trailFade {
  from {
    opacity: 0.6;
    transform: scale(1);
  }
  to {
    opacity: 0;
    transform: scale(0.3);
  }
}

    .login-card {
      position: relative;
      z-index: 3;
      width: 390px;
      padding: 32px 30px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      backdrop-filter: blur(16px);
    }

    .login-card.error-shake {
      animation: cardShake 0.25s ease;
    }

    @keyframes cardShake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    .login-card.success-glow {
  box-shadow: 0 0 30px rgba(34,197,94,0.5), 0 20px 50px rgba(0,0,0,0.45);
  border-color: rgba(34,197,94,0.45);
}

    .top-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      font-size: 30px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
    }

    h2 {
      text-align: center;
      margin: 0 0 8px 0;
      font-size: 28px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    .label {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: block;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px 14px 14px 42px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 14px;
      outline: none;
      transition: 0.2s ease;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96,165,250,0.18);
    }

    .toggle-row {
      text-align: right;
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 6px;
      margin-bottom: 8px;
    }

    .toggle-row label {
      cursor: pointer;
    }

    .login-btn,
    .support-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
      margin-top: 8px;
    }

    .login-btn:hover,
    .support-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.28);
    }

    .support-btn {
      background: linear-gradient(135deg, #7c3aed, #8b5cf6);
      margin-top: 12px;
    }

    .message {
      margin-top: 16px;
      min-height: 20px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .links {
      margin-top: 18px;
      text-align: center;
      line-height: 1.9;
      font-size: 14px;
    }

    .links a {
      color: #c4b5fd;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .footer-text {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }

    @media (max-width: 480px) {
      .login-card {
        width: 92%;
        padding: 26px 20px;
      }

      .mouse-creature,
      .creature-label,
      .miner,
      .ore-counter {
        display: none;
      }
    }

    .transition-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: radial-gradient(circle, rgba(30,27,75,0.95), #020617);
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  text-align: center;
}

.transition-overlay.active {
  display: flex;
  animation: fadeIn 0.4s ease forwards;
}

.mine-loader {
  font-size: 42px;
  animation: mineBounce 0.6s infinite alternate;
}

.transition-text {
  margin-top: 18px;
  font-size: 22px;
  font-weight: bold;
}

.transition-subtext {
  margin-top: 8px;
  color: #cbd5e1;
  font-size: 14px;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes mineBounce {
  from { transform: translateY(0) rotate(-8deg); }
  to { transform: translateY(-10px) rotate(8deg); }
}
  </style>
</head>
<body>
  <div class="background" id="backgroundLayer">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <div class="cave-dust dust1"></div>
    <div class="cave-dust dust2"></div>
    <div class="cave-dust dust3"></div>
    <div class="cave-dust dust4"></div>
  </div>

  <div class="ore ore1"></div>
  <div class="ore ore2"></div>
  <div class="ore ore3"></div>

  <div class="ore-counter" id="oreCounter">💎 Ore: 0</div>

  <div class="miner">⛏️</div>

  <div class="mouse-creature" id="mouseCreature">
    <div class="leg leg1"></div>
    <div class="leg leg2"></div>
    <div class="leg leg3"></div>
    <div class="leg leg4"></div>
    <div class="spider-body">
      <div class="spider-eye eye-left"></div>
      <div class="spider-eye eye-right"></div>
    </div>
  </div>

  <div class="creature-label" id="creatureLabel">Cave watcher</div>

  <div class="login-card" id="loginCard">
    <div class="top-icon">⛏️</div>

    <h2>Welcome Back</h2>
    <div class="subtitle">Sign in to continue into Abyss Miner</div>

    <div class="field">
      <label class="label">Username or Email</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="loginInput" placeholder="Enter username or email">
      </div>
    </div>

    <div class="field">
      <label class="label">Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Enter password">
      </div>
    </div>

    <div class="toggle-row">
      <label><input type="checkbox" onclick="togglePassword()"> Show Password</label>
    </div>

    <button class="login-btn" onclick="login()">Login</button>

    <div class="message" id="message"></div>

    <div class="links">
      <div>No account yet? <a href="/register.html">Create account</a></div>
      <div><a href="/forgot-password.html">Forgot password?</a></div>
    </div>

    <div class="footer-text">Abyss Miner Web Portal</div>
  </div>

  <div class="transition-overlay" id="transitionOverlay">
  <div class="mine-loader">⛏️</div>
  <div class="transition-text">Entering the Mine...</div>
  <div class="transition-subtext">Loading your Abyss Miner portal</div>
</div>

  <script>
    const creature = document.getElementById("mouseCreature");
    const creatureLabel = document.getElementById("creatureLabel");
    const oreCounter = document.getElementById("oreCounter");
    const loginCard = document.getElementById("loginCard");
    const backgroundLayer = document.getElementById("backgroundLayer");
    const miner = document.querySelector(".miner");
    const ores = document.querySelectorAll(".ore");
    const ambientSound = new Audio("/sounds/ambient.mp3");
ambientSound.loop = true;
ambientSound.volume = 0.25; // soft background

let targetOre = null;
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let creatureX = 80;
    let creatureY = 80;
    let lastAttackTime = 0;
    let oreCount = 0;
    let lastTrailTime = 0;

    const passwordInput = document.getElementById("password");

// When user clicks password
passwordInput.addEventListener("focus", function() {
  creature.classList.add("watching");
});

// When user leaves password
passwordInput.addEventListener("blur", function() {
  creature.classList.remove("watching");
  creature.classList.remove("angry");
});

// When user types password
passwordInput.addEventListener("input", function() {
  creature.classList.add("angry");

  clearTimeout(window.angryTimeout);

  window.angryTimeout = setTimeout(function() {
    creature.classList.remove("angry");
  }, 600);
});

    document.addEventListener("mousemove", function(e) {
  mouseX = e.clientX;
  mouseY = e.clientY;

  const xMove = (e.clientX / window.innerWidth - 0.5) * 45;
  const yMove = (e.clientY / window.innerHeight - 0.5) * 45;

  backgroundLayer.style.transform =
    "translate(" + xMove + "px, " + yMove + "px)";
});

    document.querySelectorAll(".ore").forEach(function(ore) {
      ore.addEventListener("click", function() {
        oreCount++;
        oreCounter.innerText = "💎 Ore: " + oreCount;

        playSound(oreSound);

        ore.classList.add("clicked");

        setTimeout(function() {
          ore.classList.remove("clicked");
        }, 350);
      });
    });

    function animateCreature() {
      const dx = mouseX - creatureX;
      const dy = mouseY - creatureY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      creatureX += dx * 0.045;
      creatureY += dy * 0.045;

      const direction = dx < 0 ? -1 : 1;
      let scale = 1;

      if (distance < 220) scale = 1.18;
      if (distance < 120) scale = 1.35;

      creature.style.left = (creatureX - 26) + "px";
      creature.style.top = (creatureY - 26) + "px";

      const trailNow = Date.now();

if (trailNow - lastTrailTime > 60) {
  const trail = document.createElement("div");
  trail.className = "spider-trail";
trail.style.left = (creatureX - 8) + "px";
trail.style.top = (creatureY - 8) + "px";
  document.body.appendChild(trail);

  setTimeout(function() {
    trail.remove();
  }, 1000);

  lastTrailTime = trailNow;
}

      creature.style.transform = "scale(" + scale + ") scaleX(" + direction + ")";

      creatureLabel.style.left = (creatureX + 22) + "px";
      creatureLabel.style.top = (creatureY - 16) + "px";

      if (distance > 24) {
        creature.classList.add("walking");
      } else {
        creature.classList.remove("walking");

        const now = Date.now();
        if (now - lastAttackTime > 1000) {
          creature.classList.add("attack");

          playSound(spiderAttackSound);

          ambientSound.volume = 0.15;

setTimeout(function() {
  ambientSound.volume = 0.25;
}, 500);

          setTimeout(function() {
            creature.classList.remove("attack");
          }, 280);

          lastAttackTime = now;
        }
      }

      // Distance between spider and miner
const minerRect = miner.getBoundingClientRect();
const minerX = minerRect.left + minerRect.width / 2;
const minerY = minerRect.top + minerRect.height / 2;

const spiderToMiner = Math.sqrt(
  (creatureX - minerX) * (creatureX - minerX) +
  (creatureY - minerY) * (creatureY - minerY)
);

// If spider is close → miner scared
if (spiderToMiner < 150) {
  miner.classList.add("scared");

  // Move miner slightly away
  const pushX = (minerX - creatureX) * 0.02;
  const pushY = (minerY - creatureY) * 0.02;

  miner.style.transform =
    "translate(" + pushX + "px, " + pushY + "px)";
} else {
  miner.classList.remove("scared");
  miner.style.transform = "";
}

// Miner moves toward ore if not scared
if (!miner.classList.contains("scared")) {

  if (!targetOre || Math.random() < 0.01) {
    targetOre = getNearestOre();
  }

  if (targetOre) {
    const minerRect = miner.getBoundingClientRect();
    const minerX = minerRect.left;
    const minerY = minerRect.top;

    const dx = targetOre.x - minerX;
    const dy = targetOre.y - minerY;

    miner.style.left = (minerX + dx * 0.02) + "px";
    miner.style.top = (minerY + dy * 0.02) + "px";

    miner.classList.add("walking");
  }

} else {
  miner.classList.remove("walking");
}

      requestAnimationFrame(animateCreature);
    }

    animateCreature();

    function shakeLoginCard() {
      loginCard.classList.add("error-shake");

      setTimeout(function() {
        loginCard.classList.remove("error-shake");
      }, 260);
    }

    function getNearestOre() {
  let closest = null;
  let minDist = Infinity;

  ores.forEach(function(ore) {
    const rect = ore.getBoundingClientRect();
    const oreX = rect.left + rect.width / 2;
    const oreY = rect.top + rect.height / 2;

    const dx = oreX - creatureX;
    const dy = oreY - creatureY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < minDist) {
      minDist = dist;
      closest = { element: ore, x: oreX, y: oreY };
    }
  });

  return closest;
}

 function togglePassword() {
  const password = document.getElementById("password");
  const isPassword = password.type === "password";

  password.type = isPassword ? "text" : "password";

  if (isPassword) {
    creature.classList.add("hide-eyes");
    creatureLabel.innerText = "Spider looks away...";
  } else {
    creature.classList.remove("hide-eyes");
    creatureLabel.innerText = "Cave watcher";
  }
}

    function contactSupport() {
      window.location.href = "/support.html";
    }

    async function login() {
      const loginInput = document.getElementById("loginInput").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      message.style.color = "#f87171";
      message.innerHTML = "";

      if (!loginInput || !password) {
        message.innerText = "Please enter username/email and password.";
        shakeLoginCard();
        return;
      }

      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          loginInput,
          password
        })
      });

      const data = await res.json();

      if (data.message && data.message.toLowerCase().includes("suspended")) {
        shakeLoginCard();

        message.innerHTML = `
          Your account has been suspended.<br>
          If you believe this is a mistake, please contact support.
          <button class="support-btn" onclick="contactSupport()">Contact Support</button>
        `;
        return;
      }

      if (data.user) {

        

        localStorage.setItem("userId", data.user.id);
        localStorage.setItem("username", data.user.username);
        localStorage.setItem("role", data.user.role);

        message.style.color = "#4ade80";
message.innerText = "Login successful.";
loginCard.classList.add("success-glow");

const transitionOverlay = document.getElementById("transitionOverlay");
transitionOverlay.classList.add("active");

setTimeout(function() {
  window.location.href = "/game.html";
}, 1400);
      } else {
        message.innerText = data.message || data.error || "Login failed.";
        shakeLoginCard();
      }


    }

    let ambientStarted = false;

document.addEventListener("click", function () {
  if (!ambientStarted) {
    ambientSound.play().catch(() => {});
    ambientStarted = true;
  }
});

  </script>
